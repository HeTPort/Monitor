# Only these filtered events are transmitted over UART. Raw dmesg may be spooled locally.
[ignore]
icontains|gpu-devfreq gpufreq: Set gpu frequency

[warn]
iregex|thermal.*(?:throttl|limit)
iregex|voltage.*(?:droop|low)

[fail]
iregex|kernel panic|\bpanic\b|\boops\b
iregex|watchdog.*(?:hard lockup|soft lockup)|rcu.*stall|hung task
iregex|gpu.*(?:hang|fault|reset)|hvgr.*(?:hang|fault|reset)
iregex|smmu.*fault|iommu.*fault|bus error|ecc.*(?:uncorrect|fatal)
iregex|pmic.*(?:fault|undervoltage)|under.?voltage
