# =========================================================
# cpu_vmin_case_rules.conf (Optimized v2.0)
# 适用平台: HiSilicon / Kirin (Android)
# 核心逻辑: Ignore(台架噪点) -> Warn(时序/前兆) -> Fail(死锁/异常/Panic)
# =========================================================

# =========================
# [dmesg_ignore] 
# 作用: 过滤测试台架断电/夹具不完美导致的正常伴生噪点
# =========================
[dmesg_ignore]
# --- 系统级常规启动/属性报错 (与CPU状态无关) ---
contains|hw_init: open /proc/boottime error
contains|init: Unable to set property
contains|Read-only property was already set
contains|init: Could not start service
contains|init: Control message: Could not find
contains|Cannot find '/system/bin/
contains|Cannot find '/vendor/bin/
contains|SELinux permission check failed
contains|selinux: SELinux:  Could not stat

# --- 安全子系统/防回滚常态日志 ---
contains|NVE kernel][nve_out_log]:nv data = 0x
contains|NVE kernel][nve_direct_access_interface]
regex|.*\[NVE kernel\]00,00,00,.*
contains|HISEC: [ENGINE    ]
contains|efuse_ffa svc failed
contains|efuse_read_item ret=0x5d000010

# --- 传感器Hub周期性刷屏 (非CPU错误) ---
contains|contexthub_log
contains|sensorhub_log_buff_left
contains|flush sensorhub log buff
contains|ssh_log_label_tabel_generate
contains|update_local_buff_index
icontains|sensor 1 origin tick

# --- LCD 正常上下电/切频流 (必须限定为 Info 级别) ---
contains|LCD_KIT/I]lcd_kit_on: fb0
contains|LCD_KIT/I]lcd_kit_off: fb0
contains|LCD_KIT/I]lcd_kit_event_handler: panel_id
contains|LCD_KIT/I]lcd_kit_get_pt_mode
contains|LCD_KIT/I]lcd_kit_get_proxmity_status
contains|LCD_KIT/I]lcd_kit_gpio_cmds_tx
contains|LCD_KIT/I]lcd_kit_pmu_ctrl
contains|LCD_KIT/I]lcd_kit_vcc_enable_count
contains|LCD_KIT/I]lcd_kit_vcc_disable_count
contains|LCD_KIT/I]lcd_kit_power_on_seq
contains|lcd_kit_set_backlight_sub: backlight_level0
contains|lcd_kit_skip_tp_notify
contains|lcd_kit_prepare_enable
contains|lcd_kit_prepare_disable
contains|lcd_kit_set_aod_panel_state
contains|wait_mipi_switch_done
contains|lcd_on_time_record
contains|lcd_kit_updt_fps
contains|lcd_kit_cmds_tx_no_lock
contains|lcd_kit_fps_on_cmds
contains|lcd_kit_check_reg_report_dsm
contains|not support cam lcd mipi reuse
# LCD 正常的寄存器读取 (非超时/非错误状态下的读值)
contains|mipi_dsi_lread_reg:470]Read register
contains|dpu_addr_offset:0x
contains|dpu_parse_layer_info:321
contains|dpu_print_layer_info:295
contains|change_exce_mode
contains|lcd_kit_ddic_exception_mode_cfg

# --- GPU/温控正常调节 ---
contains|gpu-devfreq gpufreq: Set gpu frequency

# --- 充电/电量常规Debug (台架未接电池导致的周期性空指针，必须精准匹配) ---
contains|get_charge_enable_status is null!
contains|batt_ct is not supported
contains|charge_feed_sys_wdt:NULL POINTER
contains|coul_merge_get_cathode_type error
contains|power supply battery_gauge_aux not exist
contains|power supply battery_gauge_third not exist
contains|not support ntc, use default temp
contains|coul_get_drained_battery_flag get reg value 0
contains|coul_clear_drained_battery_flag after clear reg value 0
contains|mod_rfile]:op:
contains|mod_simhotplug]:<sim_
contains|tcpc_dual_role_get_prop
contains|for print, not err.
contains|start or bracket_end wrong!


# =========================
# [dmesg_warn]
# 作用: Vmin临界态导致的时序违约、重试、轻度异常 (未彻底死机)
# =========================
[dmesg_warn]
# --- 显示时序违约 (CPU降频导致无法在VBlank内完成渲染) ---
contains|timeline worker is called too late
contains|wait_vactive_with_check_irq_status
contains|wait vactive timeout
contains|dpu_comp_abnormal_dump_reg_dm:191
contains|dpu_comp_abnormal_dump_reg_dm:198]
contains|check_exce_mode: read_value

# --- MIPI 通信重试/异常 (从机响应慢，但驱动层捕获并重试) ---
contains|mipi_dsi_set_cmds_rx_common:219]mipi read error
contains|lcd_check_power_status:44]read lcd status failed
contains|mipi_dsi_read:281
contains|mipi_dsi_read:286
contains|mipi_dsi_read:290
contains|CMD_PKT_STATUS
contains|PHY_STATUS

# --- IPC/核间通信重试警告 ---
contains|ap-mailb
contains|iomcu_ipc_link
contains|fail to sync send
contains|ap ipc err
regex|.*send tag.*failed.*

# --- 电源/温控/频率调节警告 ---
contains|smmuv3:get dev
contains|arm_smmu_domain_attch_dev iova mismatch
icontains|cpu frequency limit
icontains|thermal throttling
icontains|thermal warning
icontains|temperature warning
contains|thermal zone
icontains|voltage adjustment
icontains|frequency scaling
contains|cpufreq
contains|coul_get_basp_zero_ocv, get voltage by cap failed

# --- 恢复机制触发 ---
contains|recovering
icontains|error recovered
icontains|retry attempt
contains|store_rpc_motion_req: set enable fail


# =========================
# [dmesg_fail]
# 作用: 确定性失败 (Kernel Panic / 死锁 / 硬件Fault / 看门狗复位)
# 说明: 此类日志出现即代表该Vmin点不通，任何一条匹配即判定FAIL
# =========================
[dmesg_fail]

# ==================== 1. 绝对致命异常 ====================
contains|Kernel panic
contains|Internal error: Oops
contains|Unable to handle kernel
contains|BUG: unable to handle kernel
contains|Unable to handle kernel NULL pointer dereference
contains|segmentation fault
contains|general protection fault

# ==================== 2. CPU死锁/挂起/RPC Stall (Vmin测试金标准) ====================
regex|.*watchdog.*BUG: soft lockup.*
regex|.*watchdog.*BUG: hard lockup.*
regex|.*NMI watchdog.*BUG.*
contains|rcu_preempt detected stalls
contains|rcu_preempt self-detected stall
contains|rcu_sched self-detected stall
contains|rcu_preempt kthread starved
contains|RCU grace-period kthread stack dump
contains|Unless rcu_preempt kthread gets sufficient CPU time
contains|INFO: rcu_lockdep
contains|scheduling while atomic
regex|.*CPU.*stuck.*
regex|.*cpu.*hung.*
regex|.*cpu.*lockup.*
icontains|CPU cliff
icontains|CPU hang
icontains|cpu_park_loop

# ==================== 3. ARM64 硬件错误信号 ====================
contains|SError Interrupt
contains|Unhandled fault
contains|Uncorrectable ECC error
contains|correctable ECC error
contains|Memory failure
contains|Hardware Error
contains|cache parity error
contains|Uncorrected Error
# 捕获ARM64核心寄存器转储特征 (确保是在异常上下文中)
contains|PC is at
contains|LR is at
contains|Call trace:
contains|Stack trace:
contains|pstate:
regex|.*ESR_EL.*
regex|.*FAR_EL.*

# ==================== 4. 总线/SMMU/中断致命错误 ====================
contains|SMMU fault
contains|iommu fault
contains|bus error
contains|AXI error
contains|interconnect error
contains|arm_smmu.*page fault
contains|IRQ storm detected
contains|GIC error

# ==================== 5. 电源/PMIC/电压致命错误 (Vmin直接原因) ====================
contains|die_crack
icontains|pmic esd
icontains|pmic ocp
contains|pmic fatal error
regex|.*regulator.*failed.*
contains|regulator: failed
icontains|undervoltage
regex|.*undervolt.*
icontains|brown out
contains|voltage threshold
contains|voltage regulator error

# ==================== 6. 看门狗/任务阻塞超时 ====================
contains|Watchdog bark
contains|watchdog timeout
contains|hung_task_timeout
contains|blocked for more than
regex|.*timeout.*cpu.*
contains|hardlockup timeout
contains|softlockup timeout
contains|IRQ handler took too long

# ==================== 7. Vmin测试专用失败标识 ====================
icontains|Vmin_Fail
contains|vmin test failed
contains|Vmin margin
contains|dvfs error
contains|cpufreq: failed
# 海思平台特有的核间/频点交互失败
contains|smp_call_function_single_timeout

# ==================== 8. 内存/进程毁灭性错误 ====================
contains|out of memory: Killed process
contains|page allocation failure: order:
