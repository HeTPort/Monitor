schema_version: 1
name: gpu_smoke_kirin9030
target: gpu
platform: kirin9030
workload:
  binary: ../../tools/gpu-avs-workload
  remote_binary: bin/gpu-avs-workload
  config: ../workloads/gpu_smoke.json
  argv: [--config, config/workloads/gpu_smoke.json]
  assets:
    - {local: ../../tools/shaders/vulkan/fullscreen.vert.spv, remote: shaders/vulkan/fullscreen.vert.spv, kind: shader}
    - {local: ../../tools/shaders/vulkan/workload.frag.spv, remote: shaders/vulkan/workload.frag.spv, kind: shader}
environment: {}
baseline: null
telemetry:
  interval_ms: 1000
  required: [gpu.frequency, gpu.utilization, gpu.temperature, gpu.hang_count, gpu.power_policy]
  optional: [gpu.throttle]
kernel_monitor: critical
kernel_options: {dedupe_window_ms: 1000, max_events_per_second: 10}
