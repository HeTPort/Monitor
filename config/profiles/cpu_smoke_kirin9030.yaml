schema_version: 1
name: cpu_smoke_kirin9030
target: cpu
platform: kirin9030
workload:
  binary: ../../tools/cpu-avs-workload
  remote_binary: bin/cpu-avs-workload
  config: ../workloads/cpu_smoke.json
  argv: [--config, config/workloads/cpu_smoke.json]
environment: {}
baseline: null
telemetry:
  interval_ms: 1000
  required: [cpu.frequency, cpu.online, cpu.temperature, cpu.utilization]
  optional: [cpu.idle_residency, cpu.throttle]
kernel_monitor: critical
kernel_options: {dedupe_window_ms: 1000, max_events_per_second: 10}
