schema_version: 1
name: kirin9030
soc: Kirin9030
framework_variants: [single, dual]

identity:
  required: true
  fields:
    hardware:
      path: /proc/cmdline
      parser: kernel_cmdline
      key: ohos.boot.hardware
      accepted: [Kirin9030]
    chiptype:
      path: /proc/cmdline
      parser: kernel_cmdline
      key: ohos.boot.chiptype
      accepted: [Kirin9030]

transport:
  preference: [hdc, adb]
  require_root: true
  adb_bin: adb
  hdc_bin: hdc

serial:
  # 0831 pairing verified ttyHW0 with the PC side at 9600 baud.
  uart_candidates: [/dev/ttyHW0, /dev/ttyHW4, /dev/ttyHW5, /dev/ttyAMA0]
  baudrate: 9600
  protocol: uart-v2
  max_frame_bytes: 512
  # EOF NUL padding pushes the final short frame tail out of UART/DMA buffers.
  tail_guard_bytes: 64
  safe_utilization: 0.70
  relay:
    # Stage a binary built with the same OpenHarmony target/sysroot as workloads.
    # The ABI is intentionally not guessed; use `relay probe` on the device.
    local_asset: tools/relay/kirin9030/avs-uart-relay
    remote_asset: bin/avs-uart-relay

cpu:
  topology_glob: /sys/devices/system/cpu/cpu[0-9]*
  policy_glob: /sys/devices/system/cpu/cpufreq/policy[0-9]*
  interfaces:
    frequency:
      candidates:
        - /sys/devices/system/cpu/cpu*/cpufreq/scaling_cur_freq
        - /sys/devices/system/cpu/cpufreq/policy*/scaling_cur_freq
      # Telemetry uses the canonical policy view so one policy is not reported
      # again through every CPU symlink.
      telemetry_candidates:
        - /sys/devices/system/cpu/cpufreq/policy*/scaling_cur_freq
      telemetry_selection: all
      unit: kHz
      required: true
    minimum_frequency:
      candidates:
        - /sys/devices/system/cpu/cpu*/cpufreq/scaling_min_freq
        - /sys/devices/system/cpu/cpufreq/policy*/scaling_min_freq
      unit: kHz
      required: true
    maximum_frequency:
      candidates:
        - /sys/devices/system/cpu/cpu*/cpufreq/scaling_max_freq
        - /sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq
      unit: kHz
      required: true
    governor:
      candidates:
        - /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
        - /sys/devices/system/cpu/cpufreq/policy*/scaling_governor
      available_values_candidates:
        - /sys/devices/system/cpu/cpu*/cpufreq/scaling_available_governors
        - /sys/devices/system/cpu/cpufreq/policy*/scaling_available_governors
      require_requested_value: true
      required: true
    online:
      candidates: [/sys/devices/system/cpu/cpu*/online]
      required: true
      cpu0_implicit_online: true
    utilization:
      candidates: [/proc/stat]
      derivation: delta_busy_over_delta_total
      unit: percent
      required: true
    temperature:
      # TEST_0903 probe identified these CPU/SoC/cluster thermal zones by type.
      # Keep the platform-dependent mapping in data rather than Python or shell.
      telemetry_candidates:
        - /sys/class/thermal/thermal_zone0/temp
        - /sys/class/thermal/thermal_zone2/temp
        - /sys/class/thermal/thermal_zone3/temp
        - /sys/class/thermal/thermal_zone4/temp
        - /sys/class/thermal/thermal_zone5/temp
      telemetry_selection: all
      unit: celsius_auto
      required: true
    idle_residency:
      candidates: [/sys/devices/system/cpu/cpu*/cpuidle/state*/time]
      unit: us
      required: false
    throttle:
      candidates:
        - /sys/devices/system/cpu/cpu*/thermal_throttle/core_throttle_count
        - /sys/devices/system/cpu/cpu*/thermal_throttle/package_throttle_count
      unit: count
      required: false

gpu:
  driver_family: hvgr
  kernel_module: hvgr_kmd_v500
  kernel_module_candidates: [hvgr_kmd_v500, hvgr_kmd_v350]
  device_node: /sys/devices/platform/e2ec0000.hvgr
  interfaces:
    governor:
      candidates:
        - /sys/class/devfreq/gpufreq/governor
        - /sys/devices/platform/gpufreq/devfreq/gpufreq/governor
      available_values_candidates:
        - /sys/class/devfreq/gpufreq/available_governors
        - /sys/devices/platform/gpufreq/devfreq/gpufreq/available_governors
      require_requested_value: true
      required: true
    frequency:
      candidates:
        - /sys/class/devfreq/gpufreq/cur_freq
        - /sys/devices/platform/gpufreq/devfreq/gpufreq/cur_freq
        - /sys/kernel/debug/hvgr0/freq
      # The first two paths are aliases on the tested board; select one.
      telemetry_candidates:
        - /sys/class/devfreq/gpufreq/cur_freq
        - /sys/devices/platform/gpufreq/devfreq/gpufreq/cur_freq
        - /sys/kernel/debug/hvgr0/freq
      telemetry_selection: first
      unit: Hz
      required: true
    minimum_frequency:
      candidates:
        - /sys/class/devfreq/gpufreq/min_freq
        - /sys/devices/platform/gpufreq/devfreq/gpufreq/min_freq
      unit: Hz
      required: true
    maximum_frequency:
      candidates:
        - /sys/class/devfreq/gpufreq/max_freq
        - /sys/devices/platform/gpufreq/devfreq/gpufreq/max_freq
      unit: Hz
      required: true
    utilization:
      candidates: [/sys/devices/platform/e2ec0000.hvgr/gpu_utilisation]
      telemetry_parser: prefixed_number
      unit: percent
      required: true
    temperature:
      # TEST_0903 probe identified thermal_zone6 as the GPU zone by type.
      telemetry_candidates: [/sys/class/thermal/thermal_zone6/temp]
      telemetry_selection: first
      unit: celsius_auto
      required: true
    power_policy:
      candidates: [/sys/devices/platform/e2ec0000.hvgr/power_policy]
      required: true
    throttle:
      candidates: [/sys/kernel/debug/hvgr0/pm/gpu_throttle]
      unit: platform_text
      required: false
    hang_count:
      candidates:
        - /sys/module/hvgr_kmd_v500/parameters/gpu_hang_count
        - /sys/module/hvgr_kmd_v350/parameters/gpu_hang_count
      unit: count
      required: true

thermal:
  zone_glob: /sys/class/thermal/thermal_zone*
  match_by_type: true
  temperature_unit: auto
  plausible_range_c: {min: -40.0, max: 200.0}
  cpu_type_patterns: [cpu, soc, cluster]
  gpu_type_patterns: [gpu]
  legacy_gpu_type: /sys/class/thermal/thermal_zone5/type
  legacy_gpu_temp: /sys/class/thermal/thermal_zone5/temp
